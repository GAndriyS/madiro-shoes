services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madiro
      POSTGRES_PASSWORD: madiro
      POSTGRES_DB: madiro
    ports:
      # Host port only — set POSTGRES_PORT in .env when 5432 is taken by another
      # project. Inside the container postgres always listens on 5432, so the
      # healthcheck and `docker compose exec` are unaffected.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madiro -d madiro']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
