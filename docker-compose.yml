services:
  postgres:
    # Same major as PROD (Railway's postgres-ssl:18) and CI, so a migration
    # that only works on one version cannot pass here and fail there.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madiro
      POSTGRES_PASSWORD: madiro
      POSTGRES_DB: madiro
    ports:
      # Host port only — set POSTGRES_PORT in .env when 5432 is taken by another
      # project. Inside the container postgres always listens on 5432, so the
      # healthcheck and `docker compose exec` are unaffected.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # From 18 the image keeps its data in a version-named directory under
      # /var/lib/postgresql and refuses to start with a mount at the old
      # .../data path. The volume is named after the major because a data
      # directory never opens under a different one: moving to 18 starts an
      # empty database (re-run migrations and seeds), and the old 16 volume
      # stays untouched until `docker volume rm` — see README.
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madiro -d madiro']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-18-data:
