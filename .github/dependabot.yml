# Weekly dependency PRs, grouped so a routine week is one PR per ecosystem
# rather than twenty. Security advisories are not grouped: each gets its own
# PR so it can be merged (and released) on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Majors are deliberate upgrades (Nest 12, Prisma 8 ...), not a Monday PR.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Kyiv
