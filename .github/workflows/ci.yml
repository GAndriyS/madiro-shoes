name: CI

on:
  push:
    # `release` is what PROD deploys, so it gets the same gate as main — the
    # commit is normally already green from main, but a release must never be
    # the first time a branch is tested.
    branches: [main, release]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madiro
          POSTGRES_PASSWORD: madiro
          POSTGRES_DB: madiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madiro -d madiro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://madiro:madiro@localhost:5432/madiro?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @madiro/api prisma:generate

      # Blocks only on critical advisories in production dependencies: a new
      # high-severity CVE in a transitive package should not stop a hotfix from
      # shipping, and Dependabot opens the PR for it anyway. A critical one
      # should — that is the one case where the release is the smaller risk.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      # CLAUDE.md and AGENTS.md carry the same working agreements for every
      # coding agent; a symlink would be neater but Prettier refuses symlinks.
      - name: Agent instructions in sync
        run: diff -q CLAUDE.md AGENTS.md

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @madiro/api db:deploy

      # Fail if schema.prisma drifted from the committed migrations
      # (someone edited the schema without generating a migration).
      - name: Check migration drift
        run: pnpm --filter @madiro/api db:drift

      - name: API integration tests
        run: pnpm --filter @madiro/api test:e2e

      # Browser e2e (S-15): Playwright drives the built scanner + dashboard
      # over the real api. The api seeds its admin from the env the Playwright
      # config passes to its webServer, and reuses the job's Postgres.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter @madiro/e2e exec playwright install --with-deps chromium

      - name: Browser e2e (Playwright)
        run: pnpm e2e:pw

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
