<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madiro - dashboard</title>
    <!-- Same mark as the scanner with the brand colours swapped (ink on sand),
         so the two are tellable apart at favicon size. Regenerate with
         `pnpm --filter @madiro/dashboard icons`. -->
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="icon" href="/icons/icon-512.png" sizes="512x512" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot guard (public/boot-guard.js): a classic script, so it runs before
         the entry module below and can report when that module fails. -->
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
