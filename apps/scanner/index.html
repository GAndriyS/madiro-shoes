<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2620" />
    <!-- iOS installability (S-8): standalone mode + title on the home screen.
         The torch stays Android-only; torchSupported already hides it there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Madiro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Madiro - scanner</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot guard. A stale @madiro/shared build makes the entry module fail to
         evaluate: the page stays blank and the console stays EMPTY, because a
         module-evaluation error only surfaces as an unhandled rejection. That
         silence cost ~20 minutes in the 30.07.2026 test run. This must be
         inline and import nothing — it has to run before the module that
         breaks. -->
    <script>
      (function () {
        function report(reason) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // React mounted — not our business
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.setAttribute('data-testid', 'boot-error');
          box.style.cssText =
            'margin:0 auto;max-width:40rem;padding:2rem 1.5rem;font:14px/1.6 system-ui,sans-serif';
          box.innerHTML =
            '<h1 style="margin:0 0 .5rem;font-size:1.25rem">Застосунок не запустився</h1>' +
            '<p style="margin:0 0 1rem;color:#6b6156">Найчастіша причина — застаріла збірка. Виконайте: <code>pnpm build</code></p>';
          var pre = document.createElement('pre');
          pre.style.cssText =
            'margin:0;padding:.75rem;border-radius:.5rem;background:#f3efe9;white-space:pre-wrap;word-break:break-word;font-size:12px';
          pre.textContent = reason && reason.message ? reason.message : String(reason);
          box.appendChild(pre);
          root.appendChild(box);
        }
        addEventListener('error', function (e) {
          report(e.error || e.message);
        });
        addEventListener('unhandledrejection', function (e) {
          report(e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
